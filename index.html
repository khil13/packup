<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#E3D6BB" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="preconnect" href="https://hkysddnwwdrabfakmmdk.supabase.co" />
<title>Compare Moving Costs | PackUp</title>
<meta name="description" content="Get a free moving cost estimate and get matched with a licensed local moving company. No account needed, no bidding war — your request goes to one mover, not five." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Compare Moving Costs | PackUp" />
<meta property="og:description" content="Get a free moving cost estimate and get matched with a licensed local moving company. No account needed, no bidding war — your request goes to one mover, not five." />
<meta property="og:url" content="https://packupleads.com/" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Compare Moving Costs | PackUp" />
<meta name="twitter:description" content="Get a free moving cost estimate and get matched with a licensed local moving company. No account needed, no bidding war." />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "PackUp",
  "description": "PackUp is a referral service that matches you with a licensed, independent local moving company and does not perform moves itself.",
  "url": "https://packupleads.com/",
  "telephone": "+18622150984",
  "email": "packupleads@gmail.com",
  "areaServed": {
    "@type": "AdministrativeArea",
    "name": "Essex County, NJ"
  }
}
</script>
<style>
  :root{
    --kraft:#E3D6BB; --kraftDeep:#D3C09C; --kraftLight:#EFE6D2;
    --ink:#17150F; --ink60:#5C5647; --line:#B9A67E;
    --tape:#F0821E; --tapeDeep:#C4630D; --stamp:#1F4D46; --void:#8C3A22;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Helvetica Neue",Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--kraft);color:var(--ink);font-family:var(--sans)}
  body{min-height:100vh;min-height:100dvh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:var(--mono);font-size:14px;width:100%;
    padding:12px;border:1px solid var(--line);background:var(--kraftLight);color:var(--ink);outline:none}
  textarea{resize:none}
  input:focus,textarea:focus{border-color:var(--ink)}
  .tape{height:6px;background:var(--tape)}
  .wrap{max-width:520px;margin:0 auto}
  @media (min-width:880px){
    .wrap.formview{max-width:920px}
    main.layout{display:grid;grid-template-columns:1fr 380px;gap:32px;align-items:start}
    main.layout>*+*{margin-top:0}
  }
  .pad{padding:20px}
  .mono{font-family:var(--mono)}
  .label{font-family:var(--mono);color:var(--ink60);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
  .card{background:var(--kraftLight);border:1px solid var(--line)}
  .row{display:flex;gap:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .chip{padding:8px 12px;border:1px solid var(--line);font-family:var(--mono);font-size:12px;letter-spacing:.06em;background:transparent;color:var(--ink)}
  .chip.on{background:#17150F;border-color:#17150F;color:var(--kraftLight)}
  .btn{padding:14px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary{background:var(--tape);color:var(--ink)}
  .btn-dark{background:var(--ink);color:var(--kraft)}
  .btn-ghost{border:1px solid var(--line)}
  .btn:disabled{background:var(--kraftDeep);cursor:not-allowed}
  .hidden{display:none!important}
  .stack>*+*{margin-top:12px}
  .stack5>*+*{margin-top:20px}
  h1{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .muted{color:var(--ink60)}
  a{color:var(--tapeDeep)}
  header{padding:24px 20px 16px;border-bottom:1px solid var(--line)}
  main{padding:20px 20px 60px}
  .ticket{background:var(--kraftLight);border:2px solid var(--ink)}
  .ticket .head{background:var(--ink);color:var(--kraft);padding:8px 16px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
  input[type=range]{accent-color:var(--tape);padding:0}
  .err{color:var(--void);font-size:13px}
  .ok{color:var(--stamp);font-size:13px}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 0.8s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="tape"></div>
<div id="app" class="wrap"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   PackUp — public quote request form (no login required)
============================================================ */
const SB_URL = "https://hkysddnwwdrabfakmmdk.supabase.co";
const SB_KEY = "sb_publishable_fbJw86MrQjxIFb-0-lTMKw_9cWDWheP";
const sb = supabase.createClient(SB_URL, SB_KEY);

// which business this form belongs to — omitted on old/bare links, which
// still work as long as exactly one business exists (see get_public_rates)
const urlParams = new URLSearchParams(location.search);
const BIZ_OWNER = urlParams.get("biz") || null;

// standard campaign-tracking params, passed straight through to the lead
// so we can tell which channel (ad, partner link, flyer QR code) it came from
const UTM_SOURCE = urlParams.get("utm_source") || null;
const UTM_MEDIUM = urlParams.get("utm_medium") || null;
const UTM_CAMPAIGN = urlParams.get("utm_campaign") || null;

// referral link — the shared code is just the referrer's own lead or
// partner id (see dashboard "Referral link" / partner portal), resolved
// and priced server-side via get_referral_discount so this page never has
// to know or trust a discount amount on its own
const REF_CODE = urlParams.get("ref") || null;

const SIZES = {
  studio:{label:"Studio",crew:2,hours:3,lbs:1800},
  br1:{label:"1 bedroom",crew:2,hours:4,lbs:2600},
  br2:{label:"2 bedroom",crew:3,hours:6,lbs:4500},
  br3:{label:"3 bedroom",crew:4,hours:8,lbs:7500},
  br4:{label:"4+ bedroom",crew:5,hours:10,lbs:11000},
};
const ACCESS = {
  ground:{label:"Ground floor",mult:1.0},
  oneFlight:{label:"One flight",mult:1.12},
  twoPlus:{label:"Two+ flights",mult:1.24},
  elevator:{label:"Elevator",mult:1.15},
};
const SOURCES = ["Google","Yelp","Referral","Facebook","Yard sign","Repeat","Other"];

const $ = (id) => document.getElementById(id);
const app = $("app");
const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, m => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money = (n) => "$" + Math.round(n||0).toLocaleString();

function contactError(phone, email){
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim()))
    return "Please enter a valid email address.";
  if(phone){
    const digits = (phone.match(/\d/g)||[]).length;
    if(/[^\d\s()+.\-]/.test(phone)) return "Please enter a valid phone number using digits only.";
    if(digits < 7) return "Please enter a complete phone number.";
  }
  return null;
}

function estimate(input, s){
  const size = SIZES[input.home_size]; if(!size) return null;
  const access = ACCESS[input.access] || ACCESS.ground;
  const miles = Number(input.miles)||0;
  let base = 0; const lines = [];
  if(input.move_type === "local"){
    const hrs = size.hours * access.mult * (input.packing?1.35:1);
    const labor = size.crew * s.hourly_per_mover * hrs;
    lines.push([`${size.crew} movers × ${hrs.toFixed(1)} hrs`, labor]);
    const drive = Number(s.travel_fee) + (miles>30 ? (miles-30)*2.5 : 0);
    lines.push(["Truck & travel", drive]);
    base = labor + drive;
    if(input.packing){ const mat = Math.round(size.lbs*0.06); lines.push(["Boxes & materials", mat]); base+=mat; }
  } else {
    const perLb = Number(s.long_haul_base) + miles*0.0009;
    const haul = size.lbs*perLb*access.mult;
    lines.push([`${size.lbs.toLocaleString()} lbs × ${miles} mi`, haul]);
    base = haul;
    if(input.packing){ const pack = size.lbs*0.3; lines.push(["Full packing service", pack]); base+=pack; }
    const fuel = base*0.08; lines.push(["Fuel surcharge", fuel]); base+=fuel;
  }
  const r = (n)=>Math.round(n/25)*25;
  return { low:Math.max(0,r(base*0.9)-referralDiscount), high:Math.max(0,r(base*1.12)-referralDiscount),
    lbs:size.lbs, crew:size.crew, lines:lines.map(([l,v])=>[l,Math.round(v)]) };
}
function optChip(val,text,on){
  return `<button data-val="${val}" class="chip${on?" on":""}">${text}</button>`;
}
function markBad(el, ids){ ids.forEach(id=>{ const n=el.querySelector(id); if(n) n.style.borderColor="var(--void)"; }); }
function clearBad(el, ids){ ids.forEach(id=>{ const n=el.querySelector(id); if(n) n.style.borderColor=""; }); }

let rates = null;
let referralDiscount = 0;

function header(){
  return `<header>
    <h1>Pack<span style="color:var(--tapeDeep)">Up</span></h1>
    <div class="label" style="margin-top:6px">Moving lead desk</div>
  </header>
  <div class="mono muted" style="font-size:11px;padding:16px 20px 0;line-height:1.5">
    PackUp is a referral service and does not perform moves. Please share a few details about your move, and we will connect you with an independent, licensed local moving company that will confirm final pricing.
  </div>
  <div class="mono muted" style="font-size:11px;padding:8px 20px 0">
    Serving: <a href="/movers/">Essex County, NJ</a>
  </div>`;
}

function renderError(msg){
  app.classList.remove("formview");
  app.innerHTML = `${header()}<main><div class="card pad"><p class="err">${esc(msg)}</p></div></main>`;
}

function renderForm(){
  const q = { home_size:"br2", move_type:"local", miles:12, access:"ground", packing:false };
  // honeypot — real visitors never see or fill this field
  const who = { name:"", phone:"", email:"", area:urlParams.get("area")||"", pickup:"", destination:"", source:SOURCES[0], trap:"" };
  let capturing = false;

  const draw = () => {
    const est = estimate(q, rates);
    app.classList.add("formview");
    app.innerHTML = `${header()}
    <main class="stack5 layout">
      <div class="formCol stack5">
        <div>
          <div class="label">Home size</div>
          <div class="row" style="flex-wrap:wrap" data-grp="home_size">
            ${Object.entries(SIZES).map(([k,v])=>optChip(k,v.label,q.home_size===k)).join("")}
          </div>
        </div>
        <div>
          <div class="label">Distance · ${q.miles} mi</div>
          <input type="range" min="1" max="60" value="${q.miles}" id="miles"/>
        </div>
        <div class="mono muted" style="font-size:11px">Currently taking local New Jersey moves only — long-distance/out-of-state requests aren't available yet.</div>
        <div>
          <div class="label">Access</div>
          <div class="row" style="flex-wrap:wrap" data-grp="access">
            ${Object.entries(ACCESS).map(([k,v])=>optChip(k,v.label,q.access===k)).join("")}
          </div>
        </div>
        <div>
          <div class="label">Packing service</div>
          <div class="row" data-grp="packing">
            ${optChip("no","THEY PACK",!q.packing)}
            ${optChip("yes","WE PACK",q.packing)}
          </div>
        </div>
      </div>
      <div class="summaryCol stack5">
        <div class="ticket">
          <div class="head"><span>Estimate ticket</span><span>${new Date().toLocaleDateString()}</span></div>
          <div class="pad" style="padding-bottom:12px">
            <div class="grid2" style="margin-bottom:16px">
              <div><div class="label">Est. weight</div><div class="mono" style="font-size:16px">${est.lbs.toLocaleString()} lbs</div></div>
              <div><div class="label">Crew</div><div class="mono" style="font-size:16px">${est.crew} movers</div></div>
            </div>
            <div class="stack" style="margin-bottom:16px">
              ${est.lines.map(([l,v])=>`<div class="row mono" style="justify-content:space-between;font-size:12px"><span class="muted">${l}</span><span>${money(v)}</span></div>`).join("")}
            </div>
            <div style="border-top:2px dashed var(--line);padding-top:12px">
              <div class="label">Typical cost range</div>
              <div class="mono" style="font-size:30px;font-weight:700;letter-spacing:-.02em">${money(est.low)}<span class="muted"> – </span>${money(est.high)}</div>
              ${referralDiscount>0?`<div class="mono" style="font-size:11px;margin-top:4px;color:var(--stamp)">🎉 Referral discount applied: −${money(referralDiscount)}</div>`:""}
              <div class="mono muted" style="font-size:10px;margin-top:4px">This is a general estimate for planning purposes and does not represent a price from PackUp. Your matched moving company will confirm final pricing.</div>
            </div>
          </div>
        </div>
        ${capturing ? captureForm() : `<button class="btn btn-dark" id="capBtn">REQUEST A MOVER MATCH</button>`}
      </div>
    </main>`;

    app.querySelectorAll("[data-grp]").forEach(g=>{
      g.querySelectorAll("[data-val]").forEach(b=>b.onclick=()=>{
        const grp=g.dataset.grp, val=b.dataset.val;
        if(grp==="packing") q.packing = val==="yes";
        else if(grp==="move_type"){ q.move_type=val; q.miles = val==="local"?12:400; }
        else q[grp]=val;
        draw();
      });
    });
    const mi = app.querySelector("#miles");
    if(mi) mi.oninput = (e)=>{ q.miles=Number(e.target.value); draw(); };
    const cap = app.querySelector("#capBtn");
    if(cap) cap.onclick = ()=>{ capturing=true; draw(); };
    wireCapture(est);
  };

  function captureForm(){
    return `<div class="card pad stack">
      <div class="label">Contact information</div>
      <div><div class="label">Name</div><input id="cName" value="${esc(who.name)}" placeholder="Full name"/></div>
      <div class="grid2">
        <div><div class="label">Phone</div><input id="cPhone" type="tel" inputmode="tel" value="${esc(who.phone)}" placeholder="555-0100"/></div>
        <div><div class="label">Area</div><input id="cArea" value="${esc(who.area)}" placeholder="Neighborhood"/></div>
      </div>
      <div><div class="label">Email</div><input id="cEmail" type="email" inputmode="email" value="${esc(who.email)}" placeholder="Optional"/></div>
      <div><div class="label">Pickup address</div><input id="cPickup" value="${esc(who.pickup)}" placeholder="Street address, city"/></div>
      <div><div class="label">Destination address</div><input id="cDest" value="${esc(who.destination)}" placeholder="Street address, city"/></div>
      <div><div class="label">How did you hear about us?</div><div class="row" id="cSrc" style="flex-wrap:wrap">
        ${SOURCES.map(s=>`<button data-src="${s}" class="chip${who.source===s?" on":""}">${s}</button>`).join("")}
      </div></div>
      <div style="position:absolute;left:-9999px" aria-hidden="true">
        <label>Leave this field blank<input id="cTrap" tabindex="-1" autocomplete="off"/></label>
      </div>
      <div id="cMsg" class="err hidden"></div>
      <div class="row">
        <button class="btn btn-primary" id="cSave" style="flex:1">✓ SUBMIT REQUEST</button>
        <button class="btn btn-ghost" id="cBack" style="padding-left:20px;padding-right:20px">BACK</button>
      </div>
    </div>`;
  }

  function wireCapture(est){
    const save = app.querySelector("#cSave"); if(!save) return;
    app.querySelectorAll("#cName,#cPhone,#cArea,#cEmail,#cPickup,#cDest,#cTrap").forEach(inp=>{
      inp.oninput = ()=>{ who.name=app.querySelector("#cName").value; who.phone=app.querySelector("#cPhone").value;
        who.area=app.querySelector("#cArea").value; who.email=app.querySelector("#cEmail").value;
        who.pickup=app.querySelector("#cPickup").value; who.destination=app.querySelector("#cDest").value;
        who.trap=app.querySelector("#cTrap").value; };
    });
    app.querySelectorAll("#cSrc [data-src]").forEach(b=>b.onclick=()=>{
      who.source=b.dataset.src;
      app.querySelectorAll("#cSrc [data-src]").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
    });
    app.querySelector("#cBack").onclick = ()=>{ capturing=false; draw(); };
    const msg = app.querySelector("#cMsg");
    const showErr = (t) => { msg.textContent=t; msg.classList.remove("hidden"); };
    save.onclick = async () => {
      who.name = app.querySelector("#cName").value.trim();
      if(!who.name){ showErr("Please enter your name so we can prepare your match."); return; }
      const phone = app.querySelector("#cPhone").value.trim();
      const email = app.querySelector("#cEmail").value.trim();
      const pickup = app.querySelector("#cPickup").value.trim();
      const destination = app.querySelector("#cDest").value.trim();
      clearBad(app, ["#cPhone","#cEmail","#cPickup","#cDest"]); msg.classList.add("hidden");
      const err = contactError(phone, email);
      if(err){ showErr(err); markBad(app, err.startsWith("That email")?["#cEmail"]:["#cPhone"]); return; }
      if(!phone && !email){ showErr("Please enter a phone number or email so your matched mover can reach you."); markBad(app, ["#cPhone","#cEmail"]); return; }
      if(!pickup){ showErr("Please enter a pickup address."); markBad(app, ["#cPickup"]); return; }
      if(!destination){ showErr("Please enter a destination address."); markBad(app, ["#cDest"]); return; }

      if(who.trap){ renderThanks(est); return; } // bot tripped the honeypot — pretend success, save nothing

      save.disabled = true; save.textContent = "…";
      const { error } = await sb.rpc("submit_quote_request", {
        p_name: who.name, p_phone: phone || null, p_email: email || null,
        p_area: app.querySelector("#cArea").value.trim() || null,
        p_home_size: q.home_size, p_move_type: q.move_type, p_miles: q.miles,
        p_access: q.access, p_packing: q.packing, p_notes: `Heard about us via: ${who.source}`,
        p_quote_low: est.low, p_quote_high: est.high, p_owner: BIZ_OWNER,
        p_utm_source: UTM_SOURCE, p_utm_medium: UTM_MEDIUM, p_utm_campaign: UTM_CAMPAIGN,
        p_ref: REF_CODE, p_pickup_address: pickup, p_destination_address: destination,
      });
      if(error){ showErr("We were unable to submit your request. Please try again, or call us directly."); save.disabled=false; save.textContent="✓ SUBMIT REQUEST"; return; }
      renderThanks(est);
    };
  }

  draw();
}

function renderThanks(est){
  app.classList.remove("formview");
  app.innerHTML = `${header()}
  <main>
    <div class="card pad" style="text-align:center">
      <p style="font-size:18px;font-weight:700;margin-bottom:8px">Thank you</p>
      <p class="muted" style="font-size:14px;margin-bottom:16px">A licensed local moving company will contact you shortly to confirm pricing for your estimated move of ${money(est.low)}–${money(est.high)}.</p>
      ${rates&&rates.phone?`<a class="btn btn-dark" href="tel:${esc(rates.phone)}">QUESTIONS? CALL US · ${esc(rates.phone)}</a>`:""}
    </div>
  </main>`;
}

// sb.rpc(...) is a lazy "thenable" — the fetch only actually fires once .then()
// is called, so a bare statement here would silently never send the request
sb.rpc("log_page_view", { p_path: "request.html", p_owner: BIZ_OWNER }).then(()=>{}, ()=>{});

(async () => {
  // show the header immediately instead of a bare spinner — it doesn't need
  // the rates fetch to render, so no reason to make visitors wait on it too
  app.innerHTML = `${header()}<main><div class="spin"></div></main>`;
  const { data, error } = await sb.rpc("get_public_rates", { p_owner: BIZ_OWNER });
  if(error || !data || !data.length){ renderError("This quote form is not yet available. Please check back soon."); return; }
  rates = data[0];
  if(REF_CODE){
    const { data: discount } = await sb.rpc("get_referral_discount", { p_ref: REF_CODE, p_owner: BIZ_OWNER });
    referralDiscount = Number(discount) || 0;
  }
  renderForm();
})();
</script>
</body>
</html>
