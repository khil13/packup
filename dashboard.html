<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PackUp" />
<meta name="theme-color" content="#E3D6BB" />
<title>PackUp</title>
<style>
  :root{
    --kraft:#E3D6BB; --kraftDeep:#D3C09C; --kraftLight:#EFE6D2;
    --ink:#17150F; --ink60:#5C5647; --line:#B9A67E;
    --tape:#F0821E; --tapeDeep:#C4630D; --stamp:#1F4D46; --void:#8C3A22;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"Helvetica Neue",Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--kraft);color:var(--ink);font-family:var(--sans)}
  body{min-height:100vh;min-height:100dvh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:var(--mono);font-size:14px;width:100%;
    padding:12px;border:1px solid var(--line);background:var(--kraftLight);color:var(--ink);outline:none}
  textarea{resize:none}
  input:focus,textarea:focus,select:focus{border-color:var(--ink)}
  .tape{height:6px;background:var(--tape)}
  .wrap{max-width:520px;margin:0 auto}
  .pad{padding:20px}
  .mono{font-family:var(--mono)}
  .label{font-family:var(--mono);color:var(--ink60);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
  .card{background:var(--kraftLight);border:1px solid var(--line)}
  .row{display:flex;gap:8px}
  .col{display:flex;flex-direction:column;gap:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .chip{padding:8px 12px;border:1px solid var(--line);font-family:var(--mono);font-size:12px;letter-spacing:.06em;background:transparent;color:var(--ink)}
  .chip.on{color:var(--kraftLight)}
  .btn{padding:14px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-primary{background:var(--tape);color:var(--ink)}
  .btn-dark{background:var(--ink);color:var(--kraft)}
  .btn-ghost{border:1px solid var(--line)}
  .btn:disabled{background:var(--kraftDeep);cursor:not-allowed}
  .hidden{display:none!important}
  .stack>*+*{margin-top:12px}
  .stack5>*+*{margin-top:20px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .muted{color:var(--ink60)}
  a{color:var(--tapeDeep)}
  .bar{height:16px;background:var(--kraftDeep)}
  .bar>span{display:block;height:100%}
  /* nav */
  nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--kraftLight);border-top:2px solid var(--ink);z-index:20}
  nav .wrap{width:100%;display:flex}
  nav button{flex:1;padding:12px 0 calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink60)}
  nav button .ic{width:20px;height:20px}
  nav button span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
  nav button.on{background:var(--tape);color:var(--ink)}
  header{display:flex;align-items:flex-end;justify-content:space-between;padding:20px 20px 16px;border-bottom:1px solid var(--line)}
  main{padding:20px;padding-bottom:120px}
  .toast{position:fixed;left:0;right:0;bottom:88px;display:flex;justify-content:center;pointer-events:none;z-index:30}
  .toast>div{background:var(--ink);color:var(--kraftLight);font-family:var(--mono);font-size:12px;padding:10px 16px;max-width:90%}
  .stagetag{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--kraftLight);padding:4px 8px;display:inline-block}
  .leadrow{display:flex;gap:12px;align-items:center;background:var(--kraftLight);border:1px solid var(--line);padding:12px;text-align:left;width:100%}
  .leadrow .edge{width:4px;align-self:stretch}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 0.8s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ticket{background:var(--kraftLight);border:2px solid var(--ink)}
  .ticket .head{background:var(--ink);color:var(--kraft);padding:8px 16px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
  input[type=range]{accent-color:var(--tape);padding:0}
  .err{color:var(--void);font-size:13px}
  .ok{color:var(--stamp);font-size:13px;display:flex;align-items:center;gap:6px}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="tape"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   PackUp — moving lead desk, wired to Supabase
============================================================ */
const SB_URL = "https://hkysddnwwdrabfakmmdk.supabase.co";
const SB_KEY = "sb_publishable_fbJw86MrQjxIFb-0-lTMKw_9cWDWheP";
const sb = supabase.createClient(SB_URL, SB_KEY);

/* ---- domain tables (mirror the app's options) ---- */
const SIZES = {
  studio:{label:"Studio",crew:2,hours:3,lbs:1800},
  br1:{label:"1 bedroom",crew:2,hours:4,lbs:2600},
  br2:{label:"2 bedroom",crew:3,hours:6,lbs:4500},
  br3:{label:"3 bedroom",crew:4,hours:8,lbs:7500},
  br4:{label:"4+ bedroom",crew:5,hours:10,lbs:11000},
};
const ACCESS = {
  ground:{label:"Ground floor",mult:1.0},
  oneFlight:{label:"One flight",mult:1.12},
  twoPlus:{label:"Two+ flights",mult:1.24},
  elevator:{label:"Elevator",mult:1.15},
};
const SOURCES = ["Google","Yelp","Referral","Facebook","Yard sign","Repeat","Other"];
const STAGES = ["new","quoted","booked","lost"];
const STAGE_COLOR = {new:"#F0821E",quoted:"#17150F",booked:"#1F4D46",lost:"#8C3A22"};

/* ---- state ---- */
let session = null;
let settings = null;
let leads = [];
let partners = [];
let funnelStats = null;
let tab = "board";
let openLeadId = null;

/* ---- helpers ---- */
const $ = (id) => document.getElementById(id);
const app = $("app");
const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g, m => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const money = (n) => "$" + Math.round(n||0).toLocaleString();
let toastT;
function toast(msg){
  const t = $("toast"); t.querySelector("div").textContent = msg;
  t.classList.remove("hidden"); clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.add("hidden"), 2600);
}

/* ---- contact field guards ---- */
// both optional; only flag when something's clearly wrong
function contactError(phone, email){
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim()))
    return "That email doesn't look right — check for a typo.";
  if(phone){
    const digits = (phone.match(/\d/g)||[]).length;
    if(/[^\d\s()+.\-]/.test(phone)) return "Phone should be digits only (no letters).";
    if(digits < 7) return "That phone number looks too short.";
  }
  return null;
}
function markBad(el, ids){ ids.forEach(id=>{ const n=el.querySelector(id); if(n) n.style.borderColor="var(--void)"; }); }
function clearBad(el, ids){ ids.forEach(id=>{ const n=el.querySelector(id); if(n) n.style.borderColor=""; }); }

/* ---- pricing (client-side, same math as the original) ---- */
function estimate(input, s){
  const size = SIZES[input.home_size]; if(!size) return null;
  const access = ACCESS[input.access] || ACCESS.ground;
  const miles = Number(input.miles)||0;
  let base = 0; const lines = [];
  if(input.move_type === "local"){
    const hrs = size.hours * access.mult * (input.packing?1.35:1);
    const labor = size.crew * s.hourly_per_mover * hrs;
    lines.push([`${size.crew} movers × ${hrs.toFixed(1)} hrs`, labor]);
    const drive = Number(s.travel_fee) + (miles>30 ? (miles-30)*2.5 : 0);
    lines.push(["Truck & travel", drive]);
    base = labor + drive;
    if(input.packing){ const mat = Math.round(size.lbs*0.06); lines.push(["Boxes & materials", mat]); base+=mat; }
  } else {
    const perLb = Number(s.long_haul_base) + miles*0.0009;
    const haul = size.lbs*perLb*access.mult;
    lines.push([`${size.lbs.toLocaleString()} lbs × ${miles} mi`, haul]);
    base = haul;
    if(input.packing){ const pack = size.lbs*0.3; lines.push(["Full packing service", pack]); base+=pack; }
    const fuel = base*0.08; lines.push(["Fuel surcharge", fuel]); base+=fuel;
  }
  const r = (n)=>Math.round(n/25)*25;
  return { low:r(base*0.9), high:r(base*1.12), lbs:size.lbs, crew:size.crew,
    lines:lines.map(([l,v])=>[l,Math.round(v)]) };
}

/* ---- lead price for a partner handoff: bigger homes & longer moves cost more.
   base prices are editable in Setup — these are just fallbacks. ---- */
const SIZE_PRICE_KEY = { studio:"lead_price_small", br1:"lead_price_small",
  br2:"lead_price_medium", br3:"lead_price_large", br4:"lead_price_xlarge" };
function leadPrice(l, s){
  s = s || settings;
  const key = SIZE_PRICE_KEY[l.home_size] || "lead_price_small";
  let dollars = Number(s[key]) || 12;
  if(l.move_type === "long" || (l.miles||0) > 30) dollars += Number(s.lead_price_distance_surcharge)||0;
  return Math.round(dollars * 100); // in cents
}

/* ---- partner handoff email ---- */
function partnerMailto(l, p, est){
  const subject = `New moving lead — ${l.name}${l.area?` (${l.area})`:""}`;
  const body = [
    `Name: ${l.name}`,
    l.phone && `Phone: ${l.phone}`,
    l.email && `Email: ${l.email}`,
    l.area && `Area: ${l.area}`,
    `Home size: ${SIZES[l.home_size]?.label||"—"}`,
    `Move type: ${l.move_type==="local"?"Local":"Long distance"}`,
    `Distance: ${l.miles||0} mi`,
    `Access: ${ACCESS[l.access]?.label||"—"}`,
    `Packing: ${l.packing?"Customer wants packing help":"Customer will pack themselves"}`,
    est && est.low && `Estimated range: ${money(est.low)} – ${money(est.high)}`,
    l.notes && `Notes: ${l.notes}`,
    "",
    "Sent via PackUp.",
  ].filter(Boolean).join("\n");
  return `mailto:${encodeURIComponent(p.contact_email||"")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

/* ============================================================
   DATA LAYER
============================================================ */
async function loadAll(){
  const [{data:st}, {data:ld, error}, {data:pt}, {data:fs}] = await Promise.all([
    sb.from("company_settings").select("*").maybeSingle(),
    sb.from("leads").select("*").order("created_at",{ascending:false}),
    sb.from("partners").select("*").order("created_at",{ascending:false}),
    sb.rpc("get_lead_funnel_stats"),
  ]);
  if(error) console.warn(error);
  settings = st || { company:"My Moving Co", phone:"", hourly_per_mover:62,
    travel_fee:95, long_haul_base:0.35, areas:[],
    lead_price_small:12, lead_price_medium:15, lead_price_large:19,
    lead_price_xlarge:24, lead_price_distance_surcharge:6, referral_discount:50 };
  leads = ld || [];
  partners = pt || [];
  funnelStats = (fs && fs[0]) || null;
}
async function createPartner(row){
  const { data, error } = await sb.from("partners").insert(row).select().single();
  if(error){ toast(error.message); return null; }
  partners.unshift(data); return data;
}
async function removePartner(id){
  const { error } = await sb.from("partners").delete().eq("id",id);
  if(error){ toast(error.message); return; }
  partners = partners.filter(p=>p.id!==id);
}
async function createLead(row){
  const { data, error } = await sb.from("leads").insert(row).select().single();
  if(error){ toast(error.message); return null; }
  leads.unshift(data); return data;
}
async function patchLead(id, patch){
  const { data, error } = await sb.from("leads").update(patch).eq("id",id).select().single();
  if(error){ toast(error.message); return; }
  const i = leads.findIndex(l=>l.id===id); if(i>-1) leads[i]=data;
}
async function removeLead(id){
  const { error } = await sb.from("leads").delete().eq("id",id);
  if(error){ toast(error.message); return; }
  leads = leads.filter(l=>l.id!==id);
}
async function saveSettings(patch){
  Object.assign(settings, patch);
  const { error } = await sb.from("company_settings")
    .update(patch).eq("owner", session.user.id);
  if(error) toast(error.message);
}

/* ============================================================
   AUTH SCREEN
============================================================ */
function renderAuth(){
  document.body.querySelector("main")?.remove();
  app.innerHTML = `
    <header><div>
      <h1>Pack<span style="color:var(--tapeDeep)">Up</span></h1>
      <div class="label" style="margin-top:4px">Moving lead desk</div>
    </div></header>
    <main class="stack5">
      <div class="card pad stack" style="margin-top:8px">
        <div class="label" id="authTitle">Sign in</div>
        <div>
          <div class="label">Email</div>
          <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
        </div>
        <div>
          <div class="label">Password</div>
          <input id="pw" type="password" autocomplete="current-password" placeholder="At least 6 characters" />
        </div>
        <button class="btn btn-primary" id="goBtn">SIGN IN</button>
        <button class="btn btn-ghost" id="toggleBtn">CREATE AN ACCOUNT INSTEAD</button>
        <div id="authMsg" class="err hidden"></div>
      </div>
      <p class="muted" style="font-size:12px;padding:0 4px">
        Your leads are private to this login. Nobody else can see them.
      </p>
    </main>`;

  let mode = "in";
  const msg = $("authMsg");
  const showMsg = (t, ok) => { msg.textContent=t; msg.className = ok?"ok":"err"; msg.classList.remove("hidden"); };

  $("toggleBtn").onclick = () => {
    mode = mode==="in" ? "up" : "in";
    $("authTitle").textContent = mode==="in" ? "Sign in" : "Create account";
    $("goBtn").textContent = mode==="in" ? "SIGN IN" : "CREATE ACCOUNT";
    $("toggleBtn").textContent = mode==="in" ? "CREATE AN ACCOUNT INSTEAD" : "I ALREADY HAVE AN ACCOUNT";
    $("pw").setAttribute("autocomplete", mode==="in"?"current-password":"new-password");
    msg.classList.add("hidden");
  };

  $("goBtn").onclick = async () => {
    const email = $("email").value.trim();
    const password = $("pw").value;
    if(!email || password.length<6){ showMsg("Enter an email and a password of 6+ characters."); return; }
    $("goBtn").disabled = true; $("goBtn").textContent = "…";
    try{
      if(mode==="in"){
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error){ showMsg(error.message); return; }
      } else {
        const { data, error } = await sb.auth.signUp({ email, password });
        if(error){ showMsg(error.message); return; }
        if(!data.session){
          showMsg("Account made, but email confirmation is on. Confirm the link in your inbox, or turn off \"Confirm email\" in Supabase → Authentication → Providers, then sign in.", true);
          return;
        }
      }
      // onAuthStateChange handles the rest
    } finally {
      $("goBtn").disabled = false;
      $("goBtn").textContent = mode==="in" ? "SIGN IN" : "CREATE ACCOUNT";
    }
  };
}

/* ============================================================
   MAIN SHELL
============================================================ */
function renderShell(){
  app.innerHTML = `
    <header>
      <div>
        <h1>Pack<span style="color:var(--tapeDeep)">Up</span></h1>
        <div class="label" id="coName" style="margin-top:4px"></div>
      </div>
      <button id="signout" class="mono" style="font-size:10px;letter-spacing:.1em;color:var(--ink60)">SIGN OUT</button>
    </header>
    <main id="view"></main>
    <nav><div class="wrap">
      ${navBtn("board","Board")}
      ${navBtn("leads","Leads")}
      ${navBtn("quote","Quote")}
      ${navBtn("setup","Setup")}
    </div></nav>`;
  $("coName").textContent = settings.company || "My Moving Co";
  $("signout").onclick = async () => { await sb.auth.signOut(); };
  document.querySelectorAll("nav button").forEach(b=>{
    b.onclick = () => { openLeadId=null; tab=b.dataset.tab; renderView(); syncNav(); };
  });
  renderView(); syncNav();
}
function navBtn(k,label){
  return `<button data-tab="${k}"><div class="ic">${ICON[k]}</div><span>${label}</span></button>`;
}
function syncNav(){
  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.toggle("on", b.dataset.tab===tab && !openLeadId);
  });
}

function renderView(){
  const v = $("view");
  if(openLeadId){ v.innerHTML=""; v.appendChild(leadDetail(openLeadId)); return; }
  if(tab==="board"){
    v.innerHTML = board();
    const r = $("recent");
    if(r) leads.slice(0,3).forEach(l=>r.appendChild(leadRowEl(l)));
  }
  else if(tab==="leads"){ v.innerHTML=""; v.appendChild(leadList()); }
  else if(tab==="quote"){ v.innerHTML=""; v.appendChild(quoteTool()); }
  else if(tab==="setup"){ v.innerHTML=""; v.appendChild(setupView()); }
}

/* ============================================================
   BOARD
============================================================ */
function board(){
  if(!leads.length){
    return `<div class="card pad" style="text-align:center">
      <p style="font-size:15px;margin-bottom:4px">No leads yet.</p>
      <p class="muted" style="font-size:13px;margin-bottom:16px">Price a job on the Quote tab and save it — it lands here.</p>
      <button class="btn btn-primary" onclick="go('quote')">BUILD A QUOTE</button>
    </div>`;
  }
  const c = STAGES.reduce((a,s)=>(a[s]=leads.filter(l=>l.stage===s).length,a),{});
  const pipeline = leads.filter(l=>["new","quoted"].includes(l.stage)).reduce((a,l)=>a+(l.quote_low||0),0);
  const booked = leads.filter(l=>l.stage==="booked").reduce((a,l)=>a+(l.quote_low||0),0);
  const closed = c.booked + c.lost;
  const rate = closed ? Math.round(c.booked/closed*100) : 0;
  const areas={}; leads.forEach(l=>{ if(l.area) areas[l.area]=(areas[l.area]||0)+1; });
  const topAreas = Object.entries(areas).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxArea = topAreas.length?topAreas[0][1]:1;
  const srcs={}; leads.forEach(l=>{ if(l.source) srcs[l.source]=(srcs[l.source]||0)+1; });
  const topSrc = Object.entries(srcs).sort((a,b)=>b[1]-a[1]).slice(0,4);
  // utm_source/medium only get set on website-form leads whose link was tagged
  // (?utm_source=&utm_medium=) — this is finer-grained than "source" above,
  // which is either "Website form" for all of those or a manually chosen bucket
  const utms={}; leads.forEach(l=>{
    if(!l.utm_source) return;
    const key = l.utm_medium ? `${l.utm_source} / ${l.utm_medium}` : l.utm_source;
    utms[key]=(utms[key]||0)+1;
  });
  const topUtm = Object.entries(utms).sort((a,b)=>b[1]-a[1]).slice(0,6);

  return `<div class="stack5">
    <div class="grid2">
      <div class="card pad">
        <div class="label">Open pipeline</div>
        <div class="mono" style="font-size:24px;font-weight:700">${money(pipeline)}</div>
        <div class="mono muted" style="font-size:10px">${c.new+c.quoted} jobs unclosed</div>
      </div>
      <div class="card pad">
        <div class="label">Booked</div>
        <div class="mono" style="font-size:24px;font-weight:700;color:var(--stamp)">${money(booked)}</div>
        <div class="mono muted" style="font-size:10px">${rate}% close rate</div>
      </div>
    </div>
    <div class="card pad">
      <div class="label">Stages</div>
      <div class="stack" style="--s:8px">
        ${STAGES.map(s=>`<div class="row" style="align-items:center">
          <div class="mono muted" style="font-size:10px;width:54px;text-transform:uppercase">${s}</div>
          <div class="bar" style="flex:1"><span style="width:${leads.length?c[s]/leads.length*100:0}%;background:${STAGE_COLOR[s]}"></span></div>
          <div class="mono" style="font-size:12px;width:18px;text-align:right">${c[s]}</div>
        </div>`).join("")}
      </div>
    </div>
    ${funnelStats?`<div class="card pad">
      <div class="label">Website funnel (7 days)</div>
      <div class="grid2">
        <div><div class="mono" style="font-size:22px;font-weight:700">${funnelStats.views_7d}</div><div class="mono muted" style="font-size:10px">form visits</div></div>
        <div><div class="mono" style="font-size:22px;font-weight:700;color:var(--stamp)">${funnelStats.requests_7d}</div><div class="mono muted" style="font-size:10px">requests submitted</div></div>
      </div>
      <div class="mono muted" style="font-size:10px;margin-top:8px">${funnelStats.views_7d?Math.round(funnelStats.requests_7d/funnelStats.views_7d*100):0}% of visitors submitted a request</div>
    </div>`:""}
    <div class="card pad">
      <div class="label">Where the work is</div>
      <div class="stack" style="--s:8px">
        ${topAreas.map(([a,n])=>`<div class="row" style="align-items:center">
          <div style="flex:1;font-size:13px">${esc(a)}</div>
          <div class="bar" style="width:96px;height:12px"><span style="width:${n/maxArea*100}%;background:var(--tape)"></span></div>
          <div class="mono" style="font-size:11px;width:14px;text-align:right">${n}</div>
        </div>`).join("")}
      </div>
    </div>
    ${topSrc.length?`<div class="card pad">
      <div class="label">How they found you</div>
      <div class="row" style="flex-wrap:wrap">
        ${topSrc.map(([s,n])=>`<div class="mono" style="padding:8px 12px;border:1px solid var(--line);font-size:11px">${esc(s)} <b style="color:var(--tapeDeep)">${n}</b></div>`).join("")}
      </div>
    </div>`:""}
    ${topUtm.length?`<div class="card pad">
      <div class="label">Traffic sources</div>
      <p class="muted" style="font-size:12px;margin-bottom:12px">Website-form leads whose link was tagged with ?utm_source= — e.g. an ad campaign or a partner's flyer QR code.</p>
      <div class="row" style="flex-wrap:wrap">
        ${topUtm.map(([s,n])=>`<div class="mono" style="padding:8px 12px;border:1px solid var(--line);font-size:11px">${esc(s)} <b style="color:var(--tapeDeep)">${n}</b></div>`).join("")}

}

/* ============================================================
   LEAD LIST + ROWS
============================================================ */
function stageTag(stage){
  return `<span class="stagetag" style="background:${STAGE_COLOR[stage]}">${stage}</span>`;
}
function leadRowEl(l){
  const b = document.createElement("button");
  b.className = "leadrow";
  const sub = `${SIZES[l.home_size]?.label||"—"} · ${l.move_type==="local"?`${l.miles||0} mi local`:`${l.miles||0} mi haul`}${l.area?` · ${esc(l.area)}`:""}${l.partner_id?` · → ${esc(partners.find(p=>p.id===l.partner_id)?.name||"partner")}`:""}`;
  b.innerHTML = `
    <div class="edge" style="background:${STAGE_COLOR[l.stage]}"></div>
    <div style="flex:1;min-width:0">
      <div style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l.name)}</div>
      <div class="mono muted" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sub}</div>
    </div>
    <div style="text-align:right">
      <div class="mono" style="font-size:13px;font-weight:700">${l.quote_low?money(l.quote_low):"—"}</div>
      ${stageTag(l.stage)}
    </div>`;
  b.onclick = () => { openLeadId=l.id; renderView(); syncNav(); };
  return b;
}
function leadList(){
  const el = document.createElement("div");
  el.className = "stack5";
  let filter = "all";
  const draw = () => {
    const shown = filter==="all" ? leads : leads.filter(l=>l.stage===filter);
    el.innerHTML = `
      <div class="row" style="flex-wrap:wrap">
        ${chip("all", `ALL ${leads.length}`, filter==="all")}
        ${STAGES.map(s=>chip(s, `${s.toUpperCase()} ${leads.filter(l=>l.stage===s).length}`, filter===s, STAGE_COLOR[s])).join("")}
      </div>
      <button class="btn" id="logBtn" style="border:2px dashed var(--line);color:var(--ink60)">+ LOG A CALL</button>
      <div class="stack" style="--s:8px" id="rows"></div>`;
    el.querySelectorAll("[data-chip]").forEach(c=>c.onclick=()=>{ filter=c.dataset.chip; draw(); });
    el.querySelector("#logBtn").onclick = () => openQuickAdd(el, draw);
    const rows = el.querySelector("#rows");
    if(!shown.length){ rows.innerHTML = `<p class="mono muted" style="text-align:center;padding:32px 0;font-size:12px">Nothing in ${filter}.</p>`; }
    else shown.forEach(l=>rows.appendChild(leadRowEl(l)));
  };
  draw();
  return el;
}
function chip(val,text,on,color){
  const c = on ? (color||"#17150F") : "transparent";
  return `<button data-chip="${val}" class="chip${on?" on":""}" style="${on?`background:${c};border-color:${c}`:""}">${text}</button>`;
}
function openQuickAdd(container, redraw){
  const card = document.createElement("div");
  card.className="card pad stack";
  card.innerHTML = `
    <div class="label">New inquiry</div>
    <div><div class="label">Name</div><input id="qName" placeholder="Who called?"/></div>
    <div class="grid2">
      <div><div class="label">Phone</div><input id="qPhone" type="tel" inputmode="tel" placeholder="555-0100"/></div>
      <div><div class="label">Area</div><input id="qArea" placeholder="Neighborhood"/></div>
    </div>
    <div><div class="label">Found you via</div><div class="row" id="qSrc" style="flex-wrap:wrap">
      ${SOURCES.map((s,i)=>`<button data-src="${s}" class="chip${i===0?" on":""}" style="${i===0?"background:#17150F;border-color:#17150F":""}">${s}</button>`).join("")}
    </div></div>
    <div><div class="label">Notes</div><input id="qNotes" placeholder="What do they need?"/></div>
    <div class="row">
      <button class="btn btn-primary" id="qSave" style="flex:1">SAVE LEAD</button>
      <button class="btn btn-ghost" id="qCancel" style="padding-left:20px;padding-right:20px">CANCEL</button>
    </div>`;
  container.querySelector("#logBtn").replaceWith(card);
  let src = SOURCES[0];
  card.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{
    src=b.dataset.src;
    card.querySelectorAll("[data-src]").forEach(x=>{x.classList.remove("on");x.style.background="";x.style.borderColor="";});
    b.classList.add("on"); b.style.background="#17150F"; b.style.borderColor="#17150F";
  });
  card.querySelector("#qCancel").onclick = redraw;
  card.querySelector("#qSave").onclick = async () => {
    const name = card.querySelector("#qName").value.trim();
    if(!name){ toast("A name is needed to save."); return; }
    const phone = card.querySelector("#qPhone").value.trim();
    clearBad(card, ["#qPhone"]);
    const err = contactError(phone, "");
    if(err){ toast(err); markBad(card, ["#qPhone"]); return; }
    card.querySelector("#qSave").disabled = true;
    const ok = await createLead({
      name, phone,
      area:card.querySelector("#qArea").value.trim(), source:src,
      notes:card.querySelector("#qNotes").value.trim(),
      home_size:"br1", move_type:"local", miles:10, access:"ground",
      packing:false, stage:"new",
    });
    if(ok){ toast("Lead saved."); redraw(); }
    else card.querySelector("#qSave").disabled = false;
  };
}

/* ============================================================
   LEAD DETAIL
============================================================ */
function leadDetail(id){
  const l = leads.find(x=>x.id===id);
  const el = document.createElement("div");
  el.className="stack5";
  if(!l){ el.innerHTML="<p>Lead not found.</p>"; return el; }
  let editing = false;
  let choosingPartner = false;

  const view = () => {
    const est = l.quote_low ? {low:l.quote_low,high:l.quote_high} : estimate(l, settings);
    const partner = partners.find(p=>p.id===l.partner_id);
    el.innerHTML = `
      <button class="mono muted" id="back" style="font-size:11px;letter-spacing:.1em">← BACK</button>
      <div class="card pad">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div>
            <h2 style="font-size:22px;font-weight:700;letter-spacing:-.02em">${esc(l.name)}</h2>
            <div class="mono muted" style="font-size:11px;margin-top:4px">${esc(l.area||"Area not set")} · via ${esc(l.source||"unknown")}</div>
            ${l.phone?`<div class="mono muted" style="font-size:11px;margin-top:2px">${esc(l.phone)}</div>`:""}
            ${l.email?`<div class="mono muted" style="font-size:11px;margin-top:2px">${esc(l.email)}</div>`:""}
            ${l.referred_by_id?`<div class="mono muted" style="font-size:11px;margin-top:2px;color:var(--stamp)">Came via a ${l.referred_by_type} referral · $${l.referral_discount_applied||0} off</div>`:""}
          </div>
          ${stageTag(l.stage)}
        </div>
        <div class="row" style="margin-top:16px">
          ${l.phone?`<a class="btn btn-dark" style="flex:1" href="tel:${esc(l.phone)}">CALL</a>`:""}
          ${l.email?`<a class="btn btn-ghost" style="flex:1" href="mailto:${esc(l.email)}">EMAIL</a>`:""}
          <button class="btn btn-ghost" id="edit" style="flex:1">EDIT</button>
        </div>
      </div>
      ${est&&est.low>0?`<div class="card pad">
        <div class="label">Quoted range</div>
        <div class="mono" style="font-size:26px;font-weight:700">${money(est.low)} – ${money(est.high)}</div>
        <div class="mono muted" style="font-size:11px;margin-top:4px">${SIZES[l.home_size]?.label||"—"} · ${ACCESS[l.access]?.label||"—"} · ${l.packing?"with packing":"no packing"}</div>
      </div>`:""}
      <div>
        <div class="label">Move it along</div>
        <div class="row" id="stageChips" style="flex-wrap:wrap">
          ${STAGES.map(s=>`<button data-stage="${s}" class="chip${l.stage===s?" on":""}" style="${l.stage===s?`background:${STAGE_COLOR[s]};border-color:${STAGE_COLOR[s]}`:""}">${s.toUpperCase()}</button>`).join("")}
        </div>
      </div>
      <div class="card pad">
        <div class="label">Hand off to partner</div>
        ${(l.partner_id && !choosingPartner) ? `
          <p style="font-size:14px">Sent to <b>${esc(partner?partner.name:"a removed partner")}</b>${l.sent_at?` on ${new Date(l.sent_at).toLocaleDateString()}`:""}${l.charged_cents?` for $${(l.charged_cents/100).toFixed(2)}`:""}.</p>
          <button class="btn btn-ghost" id="resendPartner" style="margin-top:12px">SEND TO A DIFFERENT PARTNER</button>
        ` : partners.length ? `
          <p class="mono muted" style="font-size:11px;margin-bottom:8px">This lead is priced at $${(leadPrice(l)/100).toFixed(2)} — bigger homes and longer moves cost more.</p>
          <select id="partnerPick">
            ${partners.map(p=>`<option value="${p.id}">${esc(p.name)} — $${(p.balance_cents/100).toFixed(2)} available</option>`).join("")}
          </select>
          <button class="btn btn-dark" id="sendPartner" style="margin-top:12px">SEND TO PARTNER</button>
        ` : `<p class="muted" style="font-size:13px">No partners added yet — add one in Setup.</p>`}
      </div>
      <div class="card pad">
        <div class="label">Referral link</div>
        <p class="muted" style="font-size:12px;margin-bottom:8px">Share this with ${esc(l.name)} — whoever books through it gets $${settings.referral_discount} off their quote.</p>
        <div class="row">
          <input id="referralUrl" readonly value="${location.origin}/?ref=${l.id}&biz=${session.user.id}" style="flex:1"/>
          <button class="btn btn-primary" id="copyReferral" style="padding-left:20px;padding-right:20px">COPY</button>
        </div>
      </div>
      <div class="card pad">
        <div class="label">Notes</div>
        <textarea id="notes" rows="4" placeholder="Access, parking, fragile items, follow-up date…">${esc(l.notes||"")}</textarea>
      </div>
      <button class="btn btn-ghost" id="del" style="border-color:var(--void);color:var(--void)">DELETE LEAD</button>`;

    el.querySelector("#back").onclick = () => { openLeadId=null; renderView(); syncNav(); };
    el.querySelector("#edit").onclick = () => { editing=true; edit(); };
    el.querySelector("#copyReferral").onclick = async () => {
      const btn = el.querySelector("#copyReferral");
      try{ await navigator.clipboard.writeText(el.querySelector("#referralUrl").value); btn.textContent="COPIED"; }
      catch{ el.querySelector("#referralUrl").select(); btn.textContent="SELECTED"; }
      setTimeout(()=>{ btn.textContent="COPY"; }, 1500);
    };
    el.querySelectorAll("[data-stage]").forEach(b=>b.onclick=async()=>{
      await patchLead(id,{stage:b.dataset.stage}); l.stage=b.dataset.stage; view();
    });
    const resendBtn = el.querySelector("#resendPartner");
    if(resendBtn) resendBtn.onclick = () => { choosingPartner=true; view(); };
    const sendBtn = el.querySelector("#sendPartner");
    if(sendBtn) sendBtn.onclick = async () => {
      const p = partners.find(x=>x.id===el.querySelector("#partnerPick").value);
      if(!p) return;
      const price = leadPrice(l);
      if(p.balance_cents < price){
        toast(`${p.name} only has $${(p.balance_cents/100).toFixed(2)} — this lead costs $${(price/100).toFixed(2)}. Add funds in Setup first.`);
        return;
      }
      sendBtn.disabled = true;
      // send_lead_to_partner does the price lookup, balance check + decrement,
      // wallet charge, and lead update in one atomic DB transaction — no
      // client-computed balance, so two near-simultaneous handoffs to the
      // same partner can't silently lose a deduction against each other.
      const { data, error } = await sb.rpc("send_lead_to_partner", { p_lead_id: id, p_partner_id: p.id });
      sendBtn.disabled = false;
      if(error){
        toast(error.message.includes("Insufficient balance")
          ? `${p.name}'s balance changed — refresh and try again.`
          : error.message);
        return;
      }
      const row = Array.isArray(data) ? data[0] : data;
      const sent_at = new Date().toISOString();
      p.balance_cents = row.new_balance_cents;
      Object.assign(l, {partner_id:p.id, sent_at, charged_cents:row.charged_cents});
      if(row.refunded_partner_id){
        const prev = partners.find(x=>x.id===row.refunded_partner_id);
        if(prev) prev.balance_cents += row.refunded_cents;
        toast(`Sent to ${p.name} for $${(row.charged_cents/100).toFixed(2)}. ${row.refunded_partner_name||"Previous partner"} refunded $${(row.refunded_cents/100).toFixed(2)} (half of their charge).`);
      }
      choosingPartner = false;
      window.location.href = partnerMailto(l, p, est);
      view();
    };
    let nt;
    el.querySelector("#notes").oninput = (e)=>{ clearTimeout(nt); const v=e.target.value; l.notes=v; nt=setTimeout(()=>patchLead(id,{notes:v}),600); };
    const del = el.querySelector("#del");
    del.onclick = async () => {
      if(del.dataset.armed){
        await removeLead(id); openLeadId=null; tab="leads"; renderView(); syncNav(); toast("Lead deleted.");
      } else { del.dataset.armed="1"; del.textContent="TAP AGAIN TO DELETE"; }
    };
  };

  const edit = () => {
    const d = { name:l.name, phone:l.phone||"", email:l.email||"", area:l.area||"", source:l.source||"Google",
      home_size:l.home_size||"br2", move_type:l.move_type||"local", miles:l.miles||12,
      access:l.access||"ground", packing:!!l.packing };

    const paint = () => {
      const est = estimate(d, settings);
      el.innerHTML = `
        <button class="mono muted" id="cancel" style="font-size:11px;letter-spacing:.1em">← CANCEL</button>
        <div class="card pad stack">
          <div class="label">Customer</div>
          <div><div class="label">Name</div><input id="e_name" value="${esc(d.name)}" placeholder="Full name"/></div>
          <div class="grid2">
            <div><div class="label">Phone</div><input id="e_phone" type="tel" inputmode="tel" value="${esc(d.phone)}" placeholder="555-0100"/></div>
            <div><div class="label">Area</div><input id="e_area" value="${esc(d.area)}" placeholder="Neighborhood"/></div>
          </div>
          <div><div class="label">Email</div><input id="e_email" type="email" inputmode="email" value="${esc(d.email)}" placeholder="name@email.com"/></div>
          <div><div class="label">Found you via</div><div class="row" data-grp="source" style="flex-wrap:wrap">
            ${SOURCES.map(s=>optChip("source",s,s,d.source===s)).join("")}
          </div></div>
        </div>
        <div class="card pad stack">
          <div class="label">Job details — these set the quote</div>
          <div><div class="label">Home size</div><div class="row" data-grp="home_size" style="flex-wrap:wrap">
            ${Object.entries(SIZES).map(([k,v])=>optChip("home_size",k,v.label,d.home_size===k)).join("")}
          </div></div>
          <div class="grid2">
            <div><div class="label">Move type</div><div class="row" data-grp="move_type">
              ${optChip("move_type","local","LOCAL",d.move_type==="local")}
              ${optChip("move_type","long","LONG",d.move_type==="long")}
            </div></div>
            <div><div class="label">Distance · ${d.miles} mi</div>
              <input type="range" min="1" max="${d.move_type==="local"?60:3000}" value="${d.miles}" id="e_miles"/></div>
          </div>
          <div><div class="label">Access</div><div class="row" data-grp="access" style="flex-wrap:wrap">
            ${Object.entries(ACCESS).map(([k,v])=>optChip("access",k,v.label,d.access===k)).join("")}
          </div></div>
          <div><div class="label">Packing</div><div class="row" data-grp="packing">
            ${optChip("packing","no","THEY PACK",!d.packing)}
            ${optChip("packing","yes","WE PACK",d.packing)}
          </div></div>
          <div style="border-top:2px dashed var(--line);padding-top:12px">
            <div class="label">Quote updates to</div>
            <div class="mono" style="font-size:22px;font-weight:700">${money(est.low)} – ${money(est.high)}</div>
          </div>
        </div>
        <button class="btn btn-primary" id="e_save">SAVE CHANGES</button>`;

      const keepText = () => {
        d.name=el.querySelector("#e_name").value; d.phone=el.querySelector("#e_phone").value;
        d.area=el.querySelector("#e_area").value; d.email=el.querySelector("#e_email").value;
      };
      el.querySelector("#cancel").onclick = () => { editing=false; view(); };
      const mi = el.querySelector("#e_miles");
      if(mi) mi.oninput = (e)=>{ keepText(); d.miles=Number(e.target.value); paint(); };
      el.querySelectorAll("[data-grp]").forEach(g=>{
        g.querySelectorAll("[data-val]").forEach(b=>b.onclick=()=>{
          keepText();
          const grp=g.dataset.grp, val=b.dataset.val;
          if(grp==="packing") d.packing = val==="yes";
          else if(grp==="move_type"){ d.move_type=val; d.miles = val==="local"?Math.min(d.miles,60):Math.max(d.miles,100); }
          else d[grp]=val;
          paint();
        });
      });
      el.querySelector("#e_save").onclick = async () => {
        keepText();
        d.name=d.name.trim(); d.phone=d.phone.trim(); d.area=d.area.trim(); d.email=d.email.trim();
        if(!d.name){ toast("A name is needed."); return; }
        clearBad(el, ["#e_phone","#e_email"]);
        const err = contactError(d.phone, d.email);
        if(err){ toast(err); markBad(el, err.startsWith("That email")?["#e_email"]:["#e_phone"]); return; }
        const est2 = estimate(d, settings);
        const patch = { name:d.name, phone:d.phone, email:d.email, area:d.area, source:d.source,
          home_size:d.home_size, move_type:d.move_type, miles:d.miles, access:d.access,
          packing:d.packing, quote_low:est2.low, quote_high:est2.high };
        el.querySelector("#e_save").disabled = true;
        await patchLead(id, patch);
        Object.assign(l, patch);
        editing=false; toast("Lead updated."); view();
      };
    };
    paint();
  };

  view();
  return el;
}

        <div><div class="label">Area</div><input id="cArea" value="${esc(who.area)}" placeholder="Neighborhood"/></div>
      </div>
      <div><div class="label">Email</div><input id="cEmail" type="email" inputmode="email" value="${esc(who.email)}" placeholder="Optional"/></div>
      <div><div class="label">Found you via</div><div class="row" id="cSrc" style="flex-wrap:wrap">
        ${SOURCES.map(s=>`<button data-src="${s}" class="chip${who.source===s?" on":""}" style="${who.source===s?"background:#17150F;border-color:#17150F":""}">${s}</button>`).join("")}
      </div></div>
      <div class="row">
        <button class="btn btn-primary" id="cSave" style="flex:1">✓ SAVE QUOTE</button>
        <button class="btn btn-ghost" id="cBack" style="padding-left:20px;padding-right:20px">BACK</button>
      </div>
    </div>`;
  }
  draw();
  return el;
}
function optChip(grp,val,text,on){
  return `<button data-val="${val}" class="chip${on?" on":""}" style="${on?"background:#17150F;border-color:#17150F":""}">${text}</button>`;
}
function wireCapture(el, q, who, est, draw, back){
  const save = el.querySelector("#cSave"); if(!save) return;
  el.querySelectorAll("#cName,#cPhone,#cArea,#cEmail").forEach(inp=>{
    inp.oninput = ()=>{ who.name=el.querySelector("#cName").value; who.phone=el.querySelector("#cPhone").value;
      who.area=el.querySelector("#cArea").value; who.email=el.querySelector("#cEmail").value; };
  });
  el.querySelectorAll("#cSrc [data-src]").forEach(b=>b.onclick=()=>{
    who.source=b.dataset.src;
    el.querySelectorAll("#cSrc [data-src]").forEach(x=>{x.classList.remove("on");x.style.background="";x.style.borderColor="";});
    b.classList.add("on"); b.style.background="#17150F"; b.style.borderColor="#17150F";
  });
  el.querySelector("#cBack").onclick = back;
  save.onclick = async () => {
    who.name=el.querySelector("#cName").value.trim();
    if(!who.name){ toast("Add a name to save the quote."); return; }
    const phone=el.querySelector("#cPhone").value.trim();
    const email=el.querySelector("#cEmail").value.trim();
    clearBad(el, ["#cPhone","#cEmail"]);
    const err = contactError(phone, email);
    if(err){ toast(err); markBad(el, err.startsWith("That email")?["#cEmail"]:["#cPhone"]); return; }
    save.disabled=true;
    const ok = await createLead({
      name:who.name, phone, email, area:el.querySelector("#cArea").value.trim(),
      source:who.source, home_size:q.home_size, move_type:q.move_type, miles:q.miles,
      access:q.access, packing:q.packing, stage:"quoted",
      quote_low:est.low, quote_high:est.high,
    });
    if(ok){ toast("Quote saved to leads."); tab="leads"; openLeadId=null; renderView(); syncNav(); }
    else save.disabled=false;
  };
}

      </div>
      <div class="card pad stack">
        <div class="label">Lead pricing — what partners pay per lead</div>
        <p class="muted" style="font-size:12px">Adjust these any time — bigger or farther jobs cost more automatically.</p>
        <div class="grid2">
          <div><div class="label">Studio / 1BR ($)</div><input id="lpSmall" type="number" step="0.01" value="${s.lead_price_small}"/></div>
          <div><div class="label">2BR ($)</div><input id="lpMedium" type="number" step="0.01" value="${s.lead_price_medium}"/></div>
        </div>
        <div class="grid2">
          <div><div class="label">3BR ($)</div><input id="lpLarge" type="number" step="0.01" value="${s.lead_price_large}"/></div>
          <div><div class="label">4+ BR ($)</div><input id="lpXlarge" type="number" step="0.01" value="${s.lead_price_xlarge}"/></div>
        </div>
        <div><div class="label">Long-distance / 30+ mi surcharge ($)</div><input id="lpSurcharge" type="number" step="0.01" value="${s.lead_price_distance_surcharge}"/></div>
      </div>
      <div class="card pad">
        <div class="label">Service area</div>
        <div class="row" style="flex-wrap:wrap;margin-bottom:12px" id="areaList">
          ${(s.areas||[]).map(a=>`<button data-area="${esc(a)}" class="mono" style="padding:8px 12px;border:1px solid var(--line);font-size:11px">${esc(a)} <span class="muted">×</span></button>`).join("") || `<span class="mono muted" style="font-size:11px">No areas yet.</span>`}
        </div>
        <div class="row">
          <input id="newArea" placeholder="Add a town or ZIP" style="flex:1"/>
          <button class="btn btn-primary" id="addArea" style="padding-left:20px;padding-right:20px">ADD</button>
        </div>
      </div>
      <div class="card pad">
        <div class="label">Your public quote form</div>
        <p class="muted" style="font-size:13px;margin-bottom:12px">Share this link — anyone who fills it out lands in your Board as a new lead. No login needed for them.</p>
        <div class="row">
          <input id="publicUrl" readonly value="${location.origin}/?biz=${session.user.id}" style="flex:1"/>
          <button class="btn btn-primary" id="copyUrl" style="padding-left:20px;padding-right:20px">COPY</button>
        </div>
        <div id="qrWrap" style="text-align:center;margin-top:16px">
          <img id="qrImg" alt="QR code linking to your quote form" style="width:180px;height:180px;background:#fff;padding:8px;border:1px solid var(--line)"/>
          <div class="mono muted" style="font-size:10px;letter-spacing:.1em;margin-top:6px">SCAN TO OPEN — GOOD FOR FLYERS & YARD SIGNS</div>
        </div>
      </div>
      <div class="card pad">
        <div class="label">Partner movers</div>
        <p class="muted" style="font-size:13px;margin-bottom:12px">Licensed companies you hand leads off to. Verify each one's NJ Public Mover License before adding them. $75 minimum to start receiving leads; $12–$25+ per lead depending on job size.</p>
        <div class="stack" style="--s:8px" id="partnerList">
          ${partners.length ? partners.map(p=>`<div class="leadrow" style="cursor:default">
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div>
              <div class="mono muted" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.license_number?`Lic. ${esc(p.license_number)}`:"No license # on file"}${p.contact_email?` · ${esc(p.contact_email)}`:""}${p.contact_phone?` · ${esc(p.contact_phone)}`:""}</div>
            </div>
            <div style="text-align:right">
              <div class="mono" style="font-size:13px;font-weight:700;color:${p.balance_cents>0?"var(--stamp)":"var(--void)"}">$${(p.balance_cents/100).toFixed(2)}</div>
              <div class="row" style="gap:10px;justify-content:flex-end;margin-top:2px">
                <button data-portal-link="${p.id}" class="mono muted" style="font-size:10px;letter-spacing:.08em">COPY PORTAL LINK</button>
                <button data-referral-link="${p.id}" class="mono muted" style="font-size:10px;letter-spacing:.08em">COPY REFERRAL LINK</button>
                <button data-del-partner="${p.id}" class="mono muted" style="font-size:10px;letter-spacing:.08em">DELETE</button>
              </div>
            </div>
          </div>`).join("") : `<span class="mono muted" style="font-size:11px">No partners added yet.</span>`}
        </div>
        <div class="stack" style="margin-top:12px">
          <input id="pName" placeholder="Company name"/>
          <div class="grid2">
            <input id="pLicense" placeholder="NJ Public Mover License #"/>
            <input id="pPhone" type="tel" inputmode="tel" placeholder="Phone"/>
          </div>
          <input id="pEmail" type="email" inputmode="email" placeholder="Email for handoffs"/>
          <button class="btn btn-primary" id="addPartner">ADD PARTNER</button>
        </div>
        ${partners.length ? `<div style="border-top:2px dashed var(--line);margin-top:16px;padding-top:16px">
          <div class="label">Record a top-up</div>
          <p class="muted" style="font-size:12px;margin-bottom:8px">Until card payments are wired up, log what a partner paid you (Zelle, Venmo, check) here.</p>
          <div class="stack">
            <select id="tuPartner">${partners.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
            <div class="grid2">
              <input id="tuAmount" type="number" min="1" step="0.01" placeholder="Amount ($)"/>
              <input id="tuNote" placeholder="Note (optional)"/>
            </div>
            <button class="btn btn-dark" id="recordTopup">RECORD TOP-UP</button>
          </div>
        </div>` : ""}
      </div>
      <div class="card pad">
        <div class="label">Account</div>
        <p class="muted" style="font-size:13px;margin-bottom:12px">${leads.length} leads, stored in your Supabase database.</p>
        ${confirmWipe
          ? `<div class="row"><button class="btn" id="wipeYes" style="flex:1;background:var(--void);color:var(--kraftLight)">YES, DELETE ALL</button><button class="btn btn-ghost" id="wipeNo" style="padding-left:20px;padding-right:20px">KEEP</button></div>`
          : `<button class="btn btn-ghost" id="wipe" style="border-color:var(--void);color:var(--void)">CLEAR ALL LEADS</button>`}
      </div>`;

    // save as you type (debounced) so nothing is lost by forgetting to click away
    let saveT, pending = null;
    const flashSaved = () => {
      const n = el.querySelector("#savedTag");
      if(n){ n.textContent = "saved"; n.style.opacity = "1"; clearTimeout(n._t); n._t = setTimeout(()=>{ n.style.opacity="0"; }, 1200); }
    };
    const flush = async () => {
      clearTimeout(saveT);
      if(!pending) return;
      const patch = pending; pending = null;
      await saveSettings(patch); flashSaved();
    };
    const commit = (patch) => {
      pending = { ...(pending||{}), ...patch };
      if(patch.company!=null) $("coName").textContent = patch.company||"My Moving Co";
      clearTimeout(saveT);
      saveT = setTimeout(flush, 500);
    };
    el.querySelector("#company").oninput = e=>commit({company:e.target.value.trim()});
    el.querySelector("#phone").oninput = e=>commit({phone:e.target.value.trim()});
    el.querySelector("#hourly").oninput = e=>commit({hourly_per_mover:Number(e.target.value)||0});
    el.querySelector("#travel").oninput = e=>commit({travel_fee:Number(e.target.value)||0});
    el.querySelector("#haul").oninput = e=>commit({long_haul_base:Number(e.target.value)||0});
    el.querySelector("#referralDiscount").oninput = e=>commit({referral_discount:Number(e.target.value)||0});
    el.querySelector("#lpSmall").oninput = e=>commit({lead_price_small:Number(e.target.value)||0});
    el.querySelector("#lpMedium").oninput = e=>commit({lead_price_medium:Number(e.target.value)||0});
    el.querySelector("#lpLarge").oninput = e=>commit({lead_price_large:Number(e.target.value)||0});
    el.querySelector("#lpXlarge").oninput = e=>commit({lead_price_xlarge:Number(e.target.value)||0});
    el.querySelector("#lpSurcharge").oninput = e=>commit({lead_price_distance_surcharge:Number(e.target.value)||0});
    // a fast tab-away before the timer fires still saves
    ["#company","#phone","#hourly","#travel","#haul","#lpSmall","#lpMedium","#lpLarge","#lpXlarge","#lpSurcharge","#referralDiscount"].forEach(id=>{
      const n = el.querySelector(id); if(n) n.onblur = flush;
    });
    el.querySelectorAll("[data-area]").forEach(b=>b.onclick=async()=>{
      await saveSettings({areas:(s.areas||[]).filter(x=>x!==b.dataset.area)}); draw();
    });
    el.querySelector("#addArea").onclick = async()=>{
      const v = el.querySelector("#newArea").value.trim(); if(!v) return;
      await saveSettings({areas:[...(s.areas||[]), v]}); draw();
    };
    el.querySelector("#copyUrl").onclick = async () => {
      const btn = el.querySelector("#copyUrl");
      try{ await navigator.clipboard.writeText(el.querySelector("#publicUrl").value); btn.textContent="COPIED"; }
      catch{ el.querySelector("#publicUrl").select(); btn.textContent="SELECTED"; }
      setTimeout(()=>{ btn.textContent="COPY"; }, 1500);
    };
    const qrImg = el.querySelector("#qrImg");
    qrImg.onerror = () => { el.querySelector("#qrWrap").style.display = "none"; };
    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(el.querySelector("#publicUrl").value)}`;
    el.querySelectorAll("[data-del-partner]").forEach(b=>b.onclick=async()=>{
      await removePartner(b.dataset.delPartner); draw();
    });
    el.querySelectorAll("[data-portal-link]").forEach(b=>b.onclick=async()=>{
      const url = `${location.origin}/partner-portal.html?partner=${b.dataset.portalLink}`;
      try{ await navigator.clipboard.writeText(url); b.textContent="COPIED"; }
      catch{ b.textContent="COPY FAILED"; }
      setTimeout(()=>{ b.textContent="COPY PORTAL LINK"; }, 1500);
    });
    el.querySelectorAll("[data-referral-link]").forEach(b=>b.onclick=async()=>{
      const url = `${location.origin}/?ref=${b.dataset.referralLink}&biz=${session.user.id}`;
      try{ await navigator.clipboard.writeText(url); b.textContent="COPIED"; }
      catch{ b.textContent="COPY FAILED"; }
      setTimeout(()=>{ b.textContent="COPY REFERRAL LINK"; }, 1500);
    });
    el.querySelector("#addPartner").onclick = async () => {
      const name = el.querySelector("#pName").value.trim();
      if(!name){ toast("A company name is needed to add a partner."); return; }
      const phone = el.querySelector("#pPhone").value.trim();
      const email = el.querySelector("#pEmail").value.trim();
      const err = contactError(phone, email);
      if(err){ toast(err); return; }
      const ok = await createPartner({
        name, license_number:el.querySelector("#pLicense").value.trim(),
        contact_phone:phone, contact_email:email,
      });
      if(ok){ toast("Partner added."); draw(); }
    };
    const recordTopup = el.querySelector("#recordTopup");
    if(recordTopup) recordTopup.onclick = async () => {
      const pid = el.querySelector("#tuPartner").value;
      const p = partners.find(x=>x.id===pid);
      if(!p) return;
      const amount = Number(el.querySelector("#tuAmount").value);
      if(!amount || amount <= 0){ toast("Enter a valid amount."); return; }
      if(p.balance_cents===0 && amount < 75){ toast("First top-up needs to be at least $75."); return; }
      const cents = Math.round(amount*100);
      const note = el.querySelector("#tuNote").value.trim();
      recordTopup.disabled = true;
      // record_partner_topup does the balance increment and the wallet
      // transaction insert in one atomic DB transaction — no client-computed
      // balance, so two near-simultaneous top-ups can't lose one against the other.
      const { data, error } = await sb.rpc("record_partner_topup", { p_partner_id: p.id, p_amount_cents: cents, p_note: note || null });
      recordTopup.disabled = false;
      if(error){ toast(error.message); return; }
      const row = Array.isArray(data) ? data[0] : data;
      p.balance_cents = row.new_balance_cents;
      toast(`Added $${amount.toFixed(2)} to ${p.name}.`);
      draw();
    };
    const wipe = el.querySelector("#wipe");
    if(wipe) wipe.onclick=()=>{ confirmWipe=true; draw(); };
    const wy = el.querySelector("#wipeYes");
    if(wy){ wy.onclick=async()=>{ for(const l of [...leads]) await removeLead(l.id); confirmWipe=false; toast("All leads cleared."); draw(); };
      el.querySelector("#wipeNo").onclick=()=>{ confirmWipe=false; draw(); }; }
  };
  draw();
  return el;
}

async function enter(){
  app.innerHTML = `<div class="spin"></div>`;
  await loadAll();
  renderShell();
}

sb.auth.onAuthStateChange((_event, s)=>{
  const wasIn = !!session;
  session = s;
  if(session && !wasIn) enter();
  else if(!session) renderAuth();
});

  const { data } = await sb.auth.getSession();
  session = data.session;
  if(session) enter(); else renderAuth();
})();
